name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Node.js 24)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

  security:
    name: Trivy security scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Scan vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          output: trivy-vulnerabilities.txt
          exit-code: '1'
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'

      - name: Scan misconfigurations
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          format: table
          output: trivy-misconfigurations.txt
          exit-code: '1'

      - name: Scan secrets
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          output: trivy-secrets.txt
          exit-code: '1'

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: trivy-security-reports
          path: trivy-*.txt
          if-no-files-found: warn
          retention-days: 14

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install semgrep==1.182.1
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip check

      - name: Run Semgrep SAST
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" --version
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config auto \
            --error \
            --exclude .venv-semgrep \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage \
            --json \
            --output semgrep-results.json \
            .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: semgrep-security-report
          path: semgrep-results.json
          if-no-files-found: warn
          retention-days: 14
